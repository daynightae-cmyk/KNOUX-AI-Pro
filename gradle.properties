org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.vfs.watch=false
org.gradle.configureondemand=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
# Do not hard-code an AAPT2 binary: /opt/bin/aapt2 is Linux-only and breaks
# Windows builds. Android Gradle Plugin selects the SDK/Maven AAPT2 per host.
