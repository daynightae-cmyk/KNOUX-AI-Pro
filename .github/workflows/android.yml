name: Android verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate Room implementations
        run: bash ./gradlew :app:kspDebugKotlin --no-parallel --max-workers=1 --no-daemon --stacktrace
      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-parallel --max-workers=1 --no-daemon --stacktrace
      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-parallel --max-workers=1 --no-daemon --stacktrace
      - name: Assemble isolated debug application
        run: bash ./gradlew :app:assembleDebug --no-parallel --max-workers=1 --no-daemon --stacktrace
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-junit-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
